<!doctype html>
<!-- data-theme="light" trava o tema claro, ignorando o modo escuro do sistema. -->
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QA Hub</title>
    <!-- Inter é a tipografia de assinatura do Untitled UI. -->
    <!-- Poppins é usada só no wordmark "QA Hub", como aproximação do traço
         geométrico e arredondado do logo da Swift (o SVG do logo é feito de
         contornos vetoriais, sem metadado de fonte para extrair). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
